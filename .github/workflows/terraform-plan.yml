name: Terraform Plan

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AWS_REGION: eu-west-3
  TF_WORKING_DIR: terraform/environments/dev

jobs:
  terraform-plan:
    name: Run Terraform plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::504441516591:role/aws-eks-platform-golden-path-dev-github-actions-terraform-plan
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Initialize Terraform
        run: terraform init

      - name: Validate Terraform
        run: terraform validate

      - name: Run Terraform plan
        run: terraform plan -no-color

      - name: Debug AWS and Terraform profile references
        run: |
          echo "AWS_PROFILE=$AWS_PROFILE"
          echo "AWS_DEFAULT_PROFILE=$AWS_DEFAULT_PROFILE"
          echo "TF_CLI_ARGS=$TF_CLI_ARGS"
          echo "TF_CLI_ARGS_init=$TF_CLI_ARGS_init"
          grep -R "tf-eks-golden-path\\|aws_profile\\|AWS_PROFILE\\|profile" . \
            --exclude-dir=.terraform \
            --exclude="terraform.tfstate*" \
            --exclude="terraform.tfvars" || true
