name: Platform CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  helm:
    name: Validate Helm chart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: "v3.18.3"

      - name: Lint Helm chart
        run: helm lint helm/incident-api

      - name: Render Helm manifests
        run: helm template incident-api helm/incident-api --namespace incident-api

      - name: Render Helm manifests with ServiceMonitor enabled
        run: helm template incident-api helm/incident-api --namespace incident-api --values observability/incident-api-observability-values.yaml

      - name: Validate Prometheus scrape annotations
        run: |
          helm template incident-api helm/incident-api --namespace incident-api | grep 'prometheus.io/scrape: "true"'
          helm template incident-api helm/incident-api --namespace incident-api | grep 'prometheus.io/path: /metrics'
          helm template incident-api helm/incident-api --namespace incident-api | grep 'prometheus.io/port: "8000"'

      - name: Validate ServiceMonitor disabled by default
        run: |
          ! helm template incident-api helm/incident-api --namespace incident-api | grep 'kind: ServiceMonitor'

      - name: Validate ServiceMonitor rendering with observability values
        run: |
          helm template incident-api helm/incident-api --namespace incident-api --values observability/incident-api-observability-values.yaml | grep 'kind: ServiceMonitor'
          helm template incident-api helm/incident-api --namespace incident-api --values observability/incident-api-observability-values.yaml | grep 'path: /metrics'
          helm template incident-api helm/incident-api --namespace incident-api --values observability/incident-api-observability-values.yaml | grep 'interval: 15s'
          helm template incident-api helm/incident-api --namespace incident-api --values observability/incident-api-observability-values.yaml | grep 'release: observability'

      - name: Validate Kubernetes RBAC manifests
        run: |
          ruby -e 'require "yaml"; docs = YAML.load_stream(File.read(ARGV[0])); abort("no YAML documents found") if docs.empty?; docs.each_with_index { |doc, index| abort("empty YAML document #{index + 1}") if doc.nil?; abort("missing apiVersion in document #{index + 1}") unless doc["apiVersion"]; abort("missing kind in document #{index + 1}") unless doc["kind"]; abort("missing metadata.name in document #{index + 1}") unless doc.dig("metadata", "name") }; puts "Kubernetes RBAC YAML validation passed"' kubernetes/rbac/github-actions-deploy.yaml

  terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Check Terraform formatting
        run: terraform fmt -recursive -check

      - name: Initialize Terraform
        run: terraform init -backend=false

      - name: Validate Terraform
        run: terraform validate
