name: Deploy Incident API

"on":
  workflow_dispatch:
    inputs:
      enable_observability:
        description: "Enable ServiceMonitor deployment for Prometheus scraping"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      image_tag:
        description: >-
          Container image tag to deploy. Defaults to the current commit SHA.
        required: false
        default: ""
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-3
  EKS_CLUSTER_NAME: aws-eks-platform-golden-path-dev-eks
  ECR_REPOSITORY_NAME: incident-api
  HELM_RELEASE_NAME: incident-api
  K8S_DEPLOYMENT_NAME: incident-api
  K8S_SERVICE_NAME: incident-api
  K8S_NAMESPACE: incident-api
  APP_PATH: apps/incident-api
  HELM_CHART_PATH: helm/incident-api
  OBSERVABILITY_VALUES_FILE: >-
    observability/incident-api-observability-values.yaml

jobs:
  deploy:
    name: Deploy Incident API
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials from GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate AWS identity
        run: |
          aws sts get-caller-identity

      - name: Fail fast if EKS cluster does not exist
        run: |
          aws eks describe-cluster \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME" \
            --query "cluster.status" \
            --output text

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image tag
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          DEFAULT_IMAGE_TAG: ${{ github.sha }}
        run: |
          if [ -n "$INPUT_IMAGE_TAG" ]; then
            echo "IMAGE_TAG=$INPUT_IMAGE_TAG" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=$DEFAULT_IMAGE_TAG" >> "$GITHUB_ENV"
          fi

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build \
            --file "$APP_PATH/Dockerfile" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY_NAME:$IMAGE_TAG" \
            "$APP_PATH"

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY_NAME:$IMAGE_TAG"

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Deploy Incident API with Helm
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ENABLE_OBSERVABILITY: ${{ inputs.enable_observability }}
        run: |
          HELM_ARGS=(
            upgrade --install "$HELM_RELEASE_NAME" "$HELM_CHART_PATH"
            --namespace "$K8S_NAMESPACE"
            --set fullnameOverride="$HELM_RELEASE_NAME"
            --set image.repository="$ECR_REGISTRY/$ECR_REPOSITORY_NAME"
            --set image.tag="$IMAGE_TAG"
          )

          if [ "$ENABLE_OBSERVABILITY" = "true" ]; then
            HELM_ARGS+=(
              --values "$OBSERVABILITY_VALUES_FILE"
            )
          fi

          helm "${HELM_ARGS[@]}"

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/"$K8S_DEPLOYMENT_NAME" \
            --namespace "$K8S_NAMESPACE" \
            --timeout=180s

      - name: Check Kubernetes resources
        run: |
          kubectl get pods,svc \
            --namespace "$K8S_NAMESPACE"

      - name: Run in-cluster health checks
        run: |
          SERVICE_URL="http://$K8S_SERVICE_NAME.$K8S_NAMESPACE.svc.cluster.local"
          SMOKE_TEST_POD="incident-api-smoke-test"

          kubectl delete pod "$SMOKE_TEST_POD" \
            --namespace "$K8S_NAMESPACE" \
            --ignore-not-found

          kubectl run "$SMOKE_TEST_POD" \
            --namespace "$K8S_NAMESPACE" \
            --restart=Never \
            --image=curlimages/curl:8.10.1 \
            --command -- sh -c "
              curl --fail --silent $SERVICE_URL/health &&
              echo &&
              curl --fail --silent $SERVICE_URL/ready
            "

          kubectl wait pod "$SMOKE_TEST_POD" \
            --namespace "$K8S_NAMESPACE" \
            --for=jsonpath='{.status.phase}'=Succeeded \
            --timeout=60s

          kubectl logs "$SMOKE_TEST_POD" \
            --namespace "$K8S_NAMESPACE"

          kubectl delete pod "$SMOKE_TEST_POD" \
            --namespace "$K8S_NAMESPACE"
