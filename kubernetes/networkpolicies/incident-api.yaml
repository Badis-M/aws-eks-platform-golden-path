---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: incident-api
  namespace: incident-api
  labels:
    app.kubernetes.io/name: incident-api
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: incident-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow in-namespace traffic, including deployment smoke test pods.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: incident-api
      ports:
        - protocol: TCP
          port: 8000

    # Allow Prometheus scraping from the observability namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 8000

  egress:
    # Allow DNS resolution through kube-dns/CoreDNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
